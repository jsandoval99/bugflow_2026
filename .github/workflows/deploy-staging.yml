name: Deploy Staging

on:
  push:
    branches:
      - dev

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@11.12.0

      - name: Show versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare npm@11.12.0 --activate
          npm ci

      - name: Lint
        run: npx nx run-many --target=lint --all

      - name: Backend Tests
        run: npx nx test api

      - name: Frontend Tests
        run: npx nx test web

  deploy-web:
    name: Deploy Vercel Staging
    needs: quality

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Inspect Vercel Output
        run: |
          du -sh .vercel/output
          find .vercel/output -type f -exec du -h {} \; | sort -hr | head -20

      - name: Deploy
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify lockfile
        run: |
          node -e "
            const lock=require('./package-lock.json');
            console.log('lockfileVersion=',lock.lockfileVersion);
            console.log(
              'has chokidar=',
              !!lock.packages['node_modules/chokidar']
            );
            console.log(
              'has readdirp=',
              !!lock.packages['node_modules/readdirp']
            );
          "

  deploy-api:
    name: Deploy Railway Staging
    needs:
      - quality
      - deploy-web

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@11.12.0

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare npm@11.12.0 --activate
          npm ci

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Run Seed
        run: npm run seed
        env:
          ENABLE_SEED: 'true'
          DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          DB_PORT: ${{ secrets.STAGING_DB_PORT }}
          DB_USERNAME: ${{ secrets.STAGING_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          DB_NAME: ${{ secrets.STAGING_DB_NAME }}