@if (state(); as s) {
  <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-[60]">
    <div
      class="bg-white rounded-2xl p-6 w-[400px] space-y-4"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-dialog-title"
      aria-describedby="confirm-dialog-message"
      tabindex="-1"
    >
      <h2 id="confirm-dialog-title" class="text-lg font-bold">
        {{ s.title }}
      </h2>
      <p id="confirm-dialog-message" class="text-sm text-gray-600 whitespace-pre-wrap">
        {{ s.message }}
      </p>
      <div class="flex justify-end gap-2">
        <button
          type="button"
          (click)="cancel()"
          class="px-4 py-2 border rounded-xl text-sm"
        >
          {{ s.cancelLabel }}
        </button>
        <button
          type="button"
          (click)="confirm()"
          class="px-4 py-2 rounded-xl text-sm text-white"
          [class.bg-red-600]="s.danger"
          [class.hover:bg-red-700]="s.danger"
          [class.bg-blue-600]="!s.danger"
          [class.hover:bg-blue-700]="!s.danger"
        >
          {{ s.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
