<div class="relative">
  <button
    (click)="toggle()"
    class="relative text-muted hover:text-primary focus:outline-none focus:ring-2 focus:ring-primary"
    aria-label="View notifications"
    title="View notifications"
  >
    🔔
    @if (unreadCount() > 0) {
      <span
        class="absolute -top-1 -right-1 bg-secondary text-xs text-black rounded-full px-1"
        aria-hidden="true"
      >
        {{ unreadCount() }}
      </span>
    }
  </button>

  @if (open()) {
    <div class="absolute right-0 mt-2 w-96 max-h-[80vh] overflow-hidden rounded-xl border bg-white shadow-lg z-50">
      <div class="p-3 border-b">
        <span class="font-semibold">
          Notifications
        </span>

        <div class="max-h-[70vh] overflow-y-auto">
          @if (!facade.notifications().length) {
            <div class="p-4 text-sm text-gray-500">
              No notifications
            </div>
          }
          @for (n of facade.notifications(); track n.id) {
            <button
              class="w-full text-left p-3 hover:bg-gray-50 border-b"
              (click)="markAsRead(n.id); openIssue(n.issueId)"
            >
              <div class="flex justify-between gap-2">
                @if (!n.read) {
                  <span class="text-xs text-blue-600">
                    new
                  </span>
                }
              </div>
              <p class="text-sm text-gray-600">
                {{ n.message }}
              </p>
            </button>
          }
        </div>

        @if (facade.notifications().length) {
          <div class="mt-3 flex gap-2 justify-end">
            <button
              type="button"
              class="rounded-lg border px-3 py-1 text-xs hover:bg-gray-50"
              (click)="markAllAsRead()"
              aria-label="Mark all notifications as read"
              title="Mark all notifications as read"
            >
              Mark all read
            </button>

            <button
              type="button"
              class="rounded-lg border px-3 py-1 text-xs text-red-600 hover:bg-red-50"
              (click)="clearNotifications()"
              aria-label="Delete all notifications"
              title="Delete all notifications"
            >
              Clear all
            </button>
          </div>
        }
      </div>
    </div>
  }
</div>
